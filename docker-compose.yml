services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nautivo
      POSTGRES_USER: nautivo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Uzupełnij plik .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - nautivo-db:/var/lib/postgresql/data

volumes:
  nautivo-db:
